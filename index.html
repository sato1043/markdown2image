<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>markdown2image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: #f5f5f5;
      color: #1a1a1a;
    }

    .app-header {
      background-color: #24292f;
      color: #ffffff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar .toolbar-label {
      font-size: 12px;
      color: #8b949e;
      margin-right: 4px;
    }

    .toolbar button {
      padding: 6px 16px;
      border: 1px solid #444c56;
      border-radius: 6px;
      background-color: #2d333b;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .toolbar button:hover:not(:disabled) {
      background-color: #444c56;
    }

    .toolbar button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .toolbar select {
      padding: 6px 12px;
      border: 1px solid #444c56;
      border-radius: 6px;
      background-color: #2d333b;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      margin-right: 8px;
    }

    .main-container {
      display: flex;
      height: calc(100vh - 48px);
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #d0d7de;
      min-width: 0;
    }

    .pane-label {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #656d76;
      background-color: #f6f8fa;
      border-bottom: 1px solid #d0d7de;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    #markdown-input {
      flex: 1;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
      font-family: "Source Code Pro", "Consolas", "Menlo", monospace;
      font-size: 14px;
      line-height: 1.6;
      background-color: #ffffff;
      color: #1a1a1a;
      tab-size: 2;
    }

    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    #svg-preview {
      flex: 1;
      padding: 16px;
      overflow: auto;
      background-color: #e8e8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #svg-preview svg {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .editor-pane {
        flex: none;
        height: 40vh;
        border-right: none;
        border-bottom: 1px solid #d0d7de;
      }

      .preview-pane {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>markdown2image</h1>
    <div class="toolbar">
      <span class="toolbar-label">Theme:</span>
      <select id="theme-select">
        <option value="github-light">GitHub Light</option>
        <option value="github-dark">GitHub Dark</option>
      </select>
      <span class="toolbar-label">Download:</span>
      <button id="download-svg">SVG</button>
      <button id="download-png">PNG</button>
    </div>
  </header>
  <div class="main-container">
    <div class="editor-pane">
      <div class="pane-label">Markdown</div>
      <textarea id="markdown-input" spellcheck="false"></textarea>
    </div>
    <div class="preview-pane">
      <div class="pane-label">Preview</div>
      <div id="svg-preview"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
