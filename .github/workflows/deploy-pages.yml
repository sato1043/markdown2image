name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

# 既定は読み取りのみ。書き込み権限は deploy job だけに与える。
permissions:
  contents: read

# 進行中のデプロイを打ち切らず、順に流す。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # .node-version の解決結果をログへ残す（意図した系列で走ったかの観測点）。
      - name: Show resolved Node version
        run: node -v

      - name: Install dependencies
        run: npm ci

      # 落ちた成果物を配信しないための歯止め。
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
